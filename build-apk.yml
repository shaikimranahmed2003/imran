name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Address of your employee API, e.g. https://payroll.example.com (use https)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: gradle --no-daemon :app:assembleDebug -PSERVER_URL="$SERVER_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: TGNPDCL-Salary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
